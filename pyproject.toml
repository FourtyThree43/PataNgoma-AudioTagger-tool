[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patangoma"
version = "1.0.0"
description = "A command-line tool to enhance your music library's metadata from multiple APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Fourtythree43", email = "shaqmwa@outlook.com" },
    { name = "Kemboiray", email = "kemboiray@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "cachetools>=5.3.3",
    "click>=8.1.7",
    "deezer-python>=6.1.1",
    "imgcat>=0.5.0",
    "inquirerpy>=0.3.4",
    "mediafile>=0.12.0",
    "musicbrainzngs>=0.7.1",
    "pillow>=10.1.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "rgbprint>=4.0.2",
    "rich>=13.7.0",
    "spotipy>=2.23.0",
]

[project.scripts]
patangoma = "patangoma.cli:cli"

[project.urls]
Homepage = "https://github.com/FourtyThree43/PataNgoma-AudioTagger-tool"
"Bug Tracker" = "https://github.com/FourtyThree43/PataNgoma-AudioTagger-tool/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.90.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["drafts"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B019",  # cache on method
]

[tool.ruff.lint.isort]
known-first-party = ["patangoma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["drafts", ".venv", ".hypothesis", ".git", ".ruff_cache", ".pytest_cache"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["patangoma"]
omit = ["tests/*"]

